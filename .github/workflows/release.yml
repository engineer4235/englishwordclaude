name: Yayın paketi (Android)

# Google Play'e yüklenecek imzalı .aab paketini üretir (docs/RELEASE.md).
# Actions → "Yayın paketi (Android)" → Run workflow ile elle çalıştırılır.
# İmza anahtarı depo sırlarından gelir; sırlar yoksa paket üretilmez.
on:
  workflow_dispatch:

jobs:
  aab:
    name: İmzalı AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Yükleme anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 sırrı yok; docs/RELEASE.md 2. bölüme bakın."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: AAB derle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Sürüm kodu çalıştırma numarasıdır; her yüklemede artar.
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: İmzayı doğrula
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose:summary "$aab" | tail -3
          if keytool -printcert -jarfile "$aab" | grep -q "CN=Android Debug"; then
            echo "::error::Paket hata ayıklama anahtarıyla imzalanmış; sırları kontrol edin."
            exit 1
          fi
          keytool -printcert -jarfile "$aab" | grep -E "Owner|SHA256" | head -2

      - name: Anahtar dosyasını sil
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
