name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analiz ve testler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Kod üretimi (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Yerelleştirme (ARB)
        run: flutter gen-l10n

      - name: Üretilen dosyalar güncel mi?
        run: git diff --exit-code -- '*.g.dart' 'lib/l10n/'

      - name: Biçim kontrolü
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Statik analiz
        run: flutter analyze

      - name: Testler
        run: flutter test

  build-android:
    name: Android derlemesi
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  build-ios:
    name: iOS derlemesi
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
