name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analiz ve testler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Kod üretimi (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Yerelleştirme (ARB)
        run: flutter gen-l10n

      - name: Üretilen dosyalar güncel mi?
        run: git diff --exit-code -- '*.g.dart' 'lib/l10n/'

      - name: Biçim kontrolü
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Statik analiz
        run: flutter analyze

      - name: Testler (kapsam ölçümüyle)
        run: flutter test --coverage

      - name: Birim test kapsamı ≥ %70 (domain + data, NFR-10)
        run: dart run tool/check_coverage.dart --min 70

  build-android:
    name: Android derlemesi
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Sürüm APK'ları (ABI başına)
        run: flutter build apk --release --split-per-abi
      - name: Boyut bütçesi (NFR-04, en fazla 60 MB)
        run: |
          limit=$((60 * 1024 * 1024))
          fail=0
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            size=$(stat -c %s "$apk")
            echo "$(basename "$apk"): $((size / 1024 / 1024)) MB"
            if [ "$size" -gt "$limit" ]; then
              echo "::error::$(basename "$apk") 60 MB sınırını aşıyor"
              fail=1
            fi
          done
          exit $fail

  build-ios:
    name: iOS derlemesi
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
